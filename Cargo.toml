[package]
name = "tidesdb"
version = "0.11.0"
edition = "2024"
authors = ["TidesDB <hello@tidesdb.com>"]
description = "TidesDB is a high-performance embeddable, durable, adaptive, and optionally cloud-native key-value storage engine"
license = "MPL-2.0"
repository = "https://github.com/tidesdb/tidesdb-rs"
homepage = "https://tidesdb.com"
documentation = "https://tidesdb.com/reference/rust/"
readme = "README.md"
keywords = ["database", "key-value", "storage", "lsm-tree", "storageengine"]
categories = ["database", "data-structures"]

[dependencies]
libc = "0.2"
thiserror = "1.0"

[build-dependencies]
pkg-config = "0.3"
cmake = "0.1"
flate2 = "1"
tar = "0.4"
cfg-if = "1"
tidesdb-src-v9-3-6 = {version = "0.1", optional = true}

[dev-dependencies]
tempfile = "3.10"

[features]
default = ["v9_3_6"]
objectstore = []
v9_3_6 = ["dep:tidesdb-src-v9-3-6"]

[lib]
name = "tidesdb"
path = "src/lib.rs"
